services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 2s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

  meridian:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      MERIDIAN_DEMO_DECISION: approve
      OLLAMA_HOST: http://host.docker.internal:11434
      RAY_OBJECT_STORE_MEMORY: "268435456"
      MERIDIAN_SANDBOX_RLIMIT: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
