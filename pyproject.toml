[project]
name = "meridian"
version = "0.1.0"
description = "Autonomous data-incident response system"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "pandera>=0.34.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "ray>=2.59.0",
    "slack-bolt>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "N",
    "C4",
    "PIE",
    "RET",
    "TC",
    "ANN",
    "PTH",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["meridian"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["meridian"]
warn_unreachable = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=prepend"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/meridian"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
