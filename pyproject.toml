[project]
name = "meridian"
version = "1.0.0"
description = "Autonomous data-incident response system"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=1.12,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-sdk>=1.27",
    "numpy>=1.24.4",
    "pandas>=2.1.1",
    "pandera>=0.34.1",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "ray>=2.59.0",
    "slack-bolt>=1.30.0",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/meridian/pipeline/lineage.yaml" = "meridian/pipeline/lineage.yaml"
"src/meridian/prompts/triage.v1.md" = "meridian/prompts/triage.v1.md"
"src/meridian/prompts/root_cause.v1.md" = "meridian/prompts/root_cause.v1.md"
"src/meridian/prompts/fix.v1.md" = "meridian/prompts/fix.v1.md"
"src/meridian/prompts/critic.v1.md" = "meridian/prompts/critic.v1.md"
"src/meridian/llm/prices.yaml" = "meridian/llm/prices.yaml"

[dependency-groups]
dev = [
    "hypothesis>=6.170.4",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["remediations", "alembic/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "N",
    "C4",
    "PIE",
    "RET",
    "TC",
    "ANN",
    "PTH",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["meridian"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["meridian"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "ray", "ray.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=prepend"]
pythonpath = ["."]
timeout = 60
timeout_func_only = true
markers = ["live: calls the configured free-tier model unless MERIDIAN_ALLOW_PAID=1"]

[tool.coverage.run]
source = ["src/meridian"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
